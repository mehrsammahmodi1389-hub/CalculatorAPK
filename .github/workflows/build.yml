name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y \
        git zip unzip openjdk-17-jdk \
        autoconf automake libtool \
        pkg-config zlib1g-dev \
        libncurses5-dev libffi-dev \
        libssl-dev cmake


    - name: Install Build tools
      run: |
        python -m pip install --upgrade pip
        pip install cython==0.29.36
        pip install buildozer==1.6.0
        pip install python-for-android==2024.1.21


    - name: Setup Android
      run: |

        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg

    - name: Setup Android SDK
      run: |

        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg

        SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager | head -n 1)

        echo "sdkmanager path:"
        echo $SDKMANAGER

        yes | $SDKMANAGER --licenses || true

        $SDKMANAGER \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "ndk;28.0.13004108"

    - name: Set Android variables
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV


    - name: Clean
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer
        rm -rf bin


    - name: Build APK
      run: |
        buildozer android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-APK
        path: bin/*.apk